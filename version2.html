<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBR Schedule</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f4;--card:#fff;--tx:#222;--mut:#777;--bd:#e3ded4;--A:#7b1c2e;--B:#7d828c;--C:#b5485a;--D:#3b3f47;--S:#5a1020;--hl:#f3dfe3;--bg:#f4f3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--tx:#eee;--mut:#9a9a9a;--bd:#363840;--hl:#4a1f28}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--tx:#eee;--mut:#9a9a9a;--bd:#363840;--hl:#4a1f28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:680px;margin:0 auto;padding:12px;font-size:17px}
h1{font-size:24px;margin:0;line-height:1.1}.hd{display:flex;align-items:center;gap:12px;background:var(--A);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;border-bottom:4px solid var(--B)}.hd small{display:block;opacity:.9;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}.lg{height:64px;width:64px;object-fit:contain;flex:none;background:#fff;border-radius:12px;padding:3px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:22px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:17px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dh{font-size:15px;font-weight:600;color:var(--tx);text-align:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:92px;padding:5px;cursor:pointer;font-size:15px;position:relative}
.c.off{opacity:.4;cursor:default}.c.today{outline:2px solid var(--A)}.c.sel{background:var(--hl)}
.c .n{color:var(--tx);font-weight:600;font-size:15px}
.l{display:inline-block;color:#fff;font-weight:700;border-radius:6px;padding:1px 9px;font-size:22px;margin-top:2px}
.l.A{background:var(--A)}.l.B{background:var(--B)}.l.C{background:var(--C)}.l.D{background:var(--D)}.l.S{background:var(--S);font-size:13px}
.nt{display:block;color:var(--tx);opacity:.8;font-size:12.5px;line-height:1.25;margin-top:3px}
#d{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:12px}
#d h2{font-size:20px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button.on{background:var(--A);color:#fff;border-color:var(--A)}
table{width:100%;border-collapse:collapse;font-size:18px}td{padding:9px 6px;border-top:1px solid var(--bd)}td:last-child{text-align:right;color:var(--mut)}
.mod td{color:var(--mut);font-style:italic}

.tabbar{display:flex;gap:8px;margin-bottom:12px}
.tabbar button{flex:1;padding:14px;font-size:19px;font-weight:700}
.tabbar button.on{background:var(--A);color:#fff;border-color:var(--A)}
#vt .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px}
#vt .lab{color:var(--tx);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
#vt .big{font-size:72px;font-weight:700;color:var(--A);font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
#vt .sub{color:var(--tx);opacity:.8;font-size:17px}
#vt .bar{height:12px;background:var(--bd);border-radius:4px;margin-top:12px;overflow:hidden}#vt .bar i{display:block;height:100%;background:var(--A);width:0}
#vt .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
#vt .top b{font-size:20px}
#vt button.on{background:var(--A);color:#fff;border-color:var(--A)}
#vt table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;font-size:19px}
#vt td{padding:14px 10px;border-top:1px solid var(--bd)}#vt tr:first-child td{border-top:0}#vt td:last-child{text-align:right;color:var(--tx);opacity:.75}
#vt tr.mod td{font-style:italic;font-size:16px;opacity:.8}
#vt tr.done{opacity:.5;text-decoration:line-through}
#vt tr.now{background:var(--A);color:#fff;font-weight:700;font-size:21px}#vt tr.now td:last-child{color:#fff;opacity:1}
[hidden]{display:none!important}
</style></head><body>

const R={A:[1,2,3,5,6,7],B:[4,1,2,8,5,6],C:[3,4,1,7,8,5],D:[2,3,4,6,7,8]};
const T={full:["7:40 - 8:35","8:39 - 9:34","9:38 - 10:31","10:35 - 11:05","11:05 - 11:35","11:39 - 12:32","12:36 - 1:31","1:35 - 2:30"],
half:["7:40 - 8:16","8:20 - 8:56","9:00 - 9:36",0,0,"9:40 - 10:16","10:20 - 10:56","11:00 - 11:35"],
delay:["9:40 - 10:15","10:19 - 10:54","10:58 - 11:31","11:35 - 12:05","12:05 - 12:35","12:39 - 1:12","1:16 - 1:51","1:55 - 2:30"]};
const S={};
RAW.split("\n").forEach(s=>{const[a,n]=s.split("|");const[d,l]=a.split(" ");const[m,dd,y]=d.split("/");
S[`${2000+ +y}-${+m}-${+dd}`]={l,n:n||""}});
const key=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

(function(){const NM=["Block 1","Block 2","Block 3","Mod 1","Mod 2","Block 4","Block 5","Block 6"],BI=[0,1,2,-1,-1,3,4,5];
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=i=>document.getElementById(i);
let delayed=false,P=[],day=null,isToday=true,info="";
const tm=(base,s)=>{let[h,m]=s.trim().split(":").map(Number);if(h<7)h+=12;return new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m)};
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60,p=n=>String(n).padStart(2,"0");return(h?h+":":"")+p(m)+":"+p(s)};
function setup(){
 const now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),e=S[key(d)];
 isToday=true;info="";
 const L=x=>x&&"ABCD".includes(x.l);
 if(!e||(!L(e)&&true)){
  if(e&&!L(e)){info=e.l+" day"+(e.n?" · "+e.n:"")+" — no block schedule listed."}
  if(!e||!L(e)){ // find next school day with letter
   let n=new Date(d);for(let i=0;i<60;i++){n.setDate(n.getDate()+1);const x=S[key(n)];if(L(x)){break}}
   if(L(S[key(n)])){d=n;e=S[key(n)];isToday=false;if(!info)info="No school today."}else{P=[];day=null;return}}
 }
 day={d,e};const half=/Half Day/.test(e.n);
 const set=half?"half":delayed?"delay":"full";
 P=[];T[set].forEach((t,i)=>{if(!t)return;const[a,b]=t.split(" - ");P.push({n:NM[i],c:BI[i]>=0?R[e.l][BI[i]]:null,s:tm(d,a),e:tm(d,b),t})});
 $("dl").style.display=half?"none":"";$("dl").classList.toggle("on",delayed);
}
function draw(){
 setup();
 if(!day){$("dt").textContent="";$("l1").textContent="No upcoming school days";$("cd").textContent="--:--";$("s1").textContent="";$("tb").innerHTML="";return}
 const{d,e}=day;
 $("dt").textContent=`${DN[d.getDay()]}, ${MN[d.getMonth()]} ${d.getDate()} · ${e.l} Day${/Half/.test(e.n)?" (Half Day)":""}`;
 $("tb").innerHTML=P.map((p,i)=>`<tr id="r${i}" class="${p.c?"":"mod"}"><td>${p.n}</td><td>${p.c?"<b>Class "+p.c+"</b>":""}</td><td>${p.t}</td></tr>`).join("");
 tick()}
function tick(){
 if(!day)return;const now=new Date();let l="",c="",s="",pc=0;
 const cur=P.findIndex(p=>now>=p.s&&now<p.e),nxt=P.findIndex(p=>now<p.s);
 P.forEach((p,i)=>{const r=$("r"+i);if(!r)return;r.className=(p.c?"":"mod ")+(isToday&&now>=p.e?"done":"")+(isToday&&i==cur?" now":"")});
 if(!isToday){l=info+" Next school day starts at "+P[0].t.split(" - ")[0];c=fmt(P[0].s-now);s="until first bell";}
 else if(cur>=0){const p=P[cur];l=`${p.n}${p.c?" · Class "+p.c:""} — time left`;c=fmt(p.e-now);s="Ends "+p.t.split(" - ")[1];pc=(now-p.s)/(p.e-p.s)*100}
 else if(nxt>=0){const p=P[nxt];l=nxt==0?"First bell":"Passing time — next: "+p.n+(p.c?" · Class "+p.c:"");c=fmt(p.s-now);s="Starts "+p.t.split(" - ")[0]}
 else{l="School's out for today";c="Done";s="See you next school day"}
 $("l1").textContent=info&&isToday?info+" "+l:l;$("cd").textContent=c;$("s1").textContent=s;$("pb").style.width=pc+"%"}
$("dl").onclick=()=>{delayed=!delayed;draw()};
draw();setInterval(tick,1000);
setInterval(()=>{if(new Date().getDate()!=(day&&day.d.getDate()))draw()},60000);
})();
(function(){const now=new Date();let mo=now,cur=null,mode="auto";
const first=new Date(2026,9,1),last=new Date(2027,5,1);
mo=(now>=first&&now<=new Date(2027,5,30))?new Date(now.getFullYear(),now.getMonth(),1):first;
const isL=l=>"ABCD".includes(l);
function draw(){
 const y=mo.getFullYear(),m=mo.getMonth();
 t.textContent=MN[m]+" "+y;
 let h=["Mon","Tue","Wed","Thu","Fri"].map(x=>`<div class="dh">${x}</div>`).join("");
 const dim=new Date(y,m+1,0).getDate();let st=0;
 for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),w=dt.getDay();if(w==0||w==6)continue;
  if(!st){st=1;h+="<div></div>".repeat(w-1)}
  const e=S[key(dt)],k=key(dt);
  const cls="c"+(e?"":" off")+(k==key(now)?" today":"")+(k==cur?" sel":"");
  const lab=e?`<span class="l ${isL(e.l)?e.l:"S"}">${e.l}</span>`:"";
  h+=`<div class="${cls}" ${e?`data-k="${k}"`:""}><span class="n">${d}</span><br>${lab}<span class="nt">${e?e.n:"No school"}</span></div>`}
 g.innerHTML=h;
 g.querySelectorAll("[data-k]").forEach(c=>c.onclick=()=>{cur=c.dataset.k;draw();detail()});
 p.disabled=mo<=first;x.disabled=mo>=last}
function detail(){
 if(!cur){d.innerHTML='<span style="color:var(--mut)">Tap a day to see each block\'s class and times.</span>';return}
 const e=S[cur],[y,m,dd]=cur.split("-").map(Number),dt=new Date(y,m-1,dd);
 let h=`<h2>${DN[dt.getDay()]}, ${MN[m-1]} ${dd} · ${isL(e.l)?e.l+" Day":e.l}</h2>`;
 if(e.n)h+=`<p style="margin:0 0 8px;color:var(--mut)">${e.n}</p>`;
 if(!isL(e.l)){d.innerHTML=h;return}
 const half=/Half Day/.test(e.n);let md=half?"half":mode=="delay"?"delay":"full";
 h+=half?"":`<div class="tabs"><button class="${md=="full"?"on":""}" data-m="auto">Full day</button><button class="${md=="delay"?"on":""}" data-m="delay">Delayed opening</button></div>`;
 h+=`<table>`;const order=[0,1,2,"M1","M2",3,4,5];
 order.forEach((b,i)=>{const tm=T[md][i];if(!tm)return;
  if(typeof b=="string")h+=`<tr class="mod"><td>${b.replace("M","Mod ")}</td><td></td><td>${tm}</td></tr>`;
  else h+=`<tr><td>Block ${b+1}</td><td><b>Class ${R[e.l][b]}</b></td><td>${tm}</td></tr>`});
 d.innerHTML=h+"</table>";
 d.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;detail()})}
p.onclick=()=>{mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);draw()};
x.onclick=()=>{mo=new Date(mo.getFullYear(),mo.getMonth()+1,1);draw()};
if(S[key(now)])cur=key(now);
draw();detail();
})();
